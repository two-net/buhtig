@if (user(); as user) {
  <div class="acct-wrap">
    <button
      #button
      type="button"
      class="avatar-btn"
      aria-haspopup="menu"
      [attr.aria-expanded]="open()"
      [attr.aria-controls]="open() ? 'account-menu' : null"
      [attr.aria-label]="'Account menu for @' + user.login"
      (click)="toggle()"
    >
      <app-avatar [name]="user.login" [src]="user.avatar_url" [size]="32" [round]="true" />
    </button>
    @if (open()) {
      <div #menu id="account-menu" class="menu" (keydown)="keydown($event)">
        <div class="who">
          <app-avatar [name]="user.login" [src]="user.avatar_url" [size]="32" [round]="true" />
          <div>
            <strong>&#64;{{ user.login }}</strong>
            @if (user.name) {
              <small>{{ user.name }}</small>
            }
          </div>
        </div>
        <p class="tok"><app-icon name="key" />{{ token() }}</p>
        <ul role="menu" aria-label="Account">
          <li role="none">
            <a role="menuitem" routerLink="/" (click)="open.set(false)"
              ><app-icon name="home" />Home</a
            >
          </li>
          <li role="none">
            <a role="menuitem" routerLink="/-/settings" (click)="open.set(false)"
              ><app-icon name="sliders" />Settings</a
            >
          </li>
          <li role="none">
            <form method="post" action="/-/auth/sign-out">
              <button role="menuitem" type="submit"><app-icon name="logout" />Sign out</button>
            </form>
          </li>
        </ul>
      </div>
    }
  </div>
} @else if (user() === null) {
  <a class="btn sm" [href]="signIn()">Sign in</a>
}
