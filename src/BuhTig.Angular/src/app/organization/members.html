<app-widget heading="Members" empty="No members to show." [wide]="true">
  <ng-template [appLoaded]="members" let-members>
    <p class="count">
      <app-compact-number [value]="members.count" />
      {{ membersLabel(members.count) }}
    </p>
    <ul>
      @for (member of members.members; track member.login) {
        <li class="stagger" [style.--i]="$index">
          <!-- Each avatar's alternative text names the member, and so the link (NFR-UX-02). -->
          <a
            [attr.href]="member.url ?? null"
            [class.dismissed]="dismissed() === member.login"
            (keydown.escape)="dismissed.set(member.login)"
            (blur)="dismissed.set(undefined)"
            (pointerleave)="dismissed.set(undefined)"
          >
            @if (member.avatarUrl; as avatar) {
              <img
                class="avatar"
                [src]="avatar"
                [alt]="member.login"
                width="40"
                height="40"
                loading="lazy"
              />
            } @else {
              <span class="avatar" role="img" [attr.aria-label]="member.login">{{
                member.login[0]
              }}</span>
            }
            <!-- The login, on hover and on focus alike (NFR-UX-03). The avatar names it already. -->
            <span class="login" aria-hidden="true">{{ member.login }}</span>
          </a>
        </li>
      }
    </ul>
  </ng-template>
</app-widget>
