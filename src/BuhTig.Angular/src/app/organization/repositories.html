<section class="panel" aria-label="Repositories">
  <div class="filters">
    <input
      #search
      class="input"
      type="search"
      [placeholder]="FIND_REPOSITORY"
      aria-label="Find a repository"
      [value]="filter().name"
      (input)="setFilter({ name: search.value })"
    />
    <select #type class="select" aria-label="Type" (change)="setFilter({ type: $any(type.value) })">
      @for (option of types(); track option) {
        <option [value]="option" [selected]="filter().type === option">{{ TYPES[option] }}</option>
      }
    </select>
    <select
      #language
      class="select"
      aria-label="Language"
      (change)="setFilter({ language: language.value || undefined })"
    >
      <option value="" [selected]="filter().language === undefined">{{ ALL_LANGUAGES }}</option>
      @for (option of languages(); track option) {
        <option [value]="option" [selected]="filter().language === option">{{ option }}</option>
      }
    </select>
    <select #order class="select" aria-label="Sort" (change)="setSort(order.value)">
      @for (option of sortKeys; track option) {
        <option [value]="option" [selected]="sort() === option">{{ SORTS[option] }}</option>
      }
    </select>
  </div>
  <p class="count-note" aria-live="polite">{{ status() }}</p>
  <app-widget heading="Repositories" [empty]="NO_REPOSITORIES" emptyIcon="repo" skeleton="list">
    <ng-template [appLoaded]="repositories">
      <ul class="rows repo-list" [attr.aria-label]="'Repositories'">
        @for (repository of page().repositories; track repository.name) {
          <li><app-repository-row [repository]="repository" /></li>
        } @empty {
          <li class="empty-note">{{ noMatch() }}</li>
        }
      </ul>
      @if (page().count > 1) {
        <nav class="pager" aria-label="Pages">
          <button type="button" [disabled]="page().index === 0" (click)="go(page().index - 1)">
            <app-icon name="chevl" />Previous
          </button>
          @for (item of pages(); track $index) {
            @if (item === 'gap') {
              <span class="gap" aria-hidden="true">…</span>
            } @else {
              <button
                type="button"
                [attr.aria-current]="item === page().index ? 'page' : null"
                [attr.aria-label]="'Page ' + page1(item)"
                (click)="go(item)"
              >
                {{ page1(item) }}
              </button>
            }
          }
          <button
            type="button"
            [disabled]="page().index >= page().count - 1"
            (click)="go(page().index + 1)"
          >
            Next<app-icon name="chevr" />
          </button>
        </nav>
      }
    </ng-template>
  </app-widget>
</section>
