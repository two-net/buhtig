<header>
  <a class="wordmark" routerLink="/">BuhTig</a>
  <app-search [compact]="true" [prefill]="'github.com/' + name()" />
  <app-account />
</header>
<main>
  @if (repository(); as repository) {
    <app-repository-header
      [name]="name()"
      [repository]="summary()?.repository"
      [fetchedAt]="summary()?.fetchedAt"
    />
    @if (summary()?.denied; as denied) {
      <app-denied [denied]="denied" />
    }
    <!-- The widgets, in two columns, or one on narrow screens (UI-05). -->
    <div class="grid">
      <app-repository-stats [owner]="repository.owner" [repo]="repository.repo" />
      <app-repository-activity [owner]="repository.owner" [repo]="repository.repo" />
      <app-repository-languages [owner]="repository.owner" [repo]="repository.repo" />
      <app-repository-contributors [owner]="repository.owner" [repo]="repository.repo" />
      <app-repository-issues [owner]="repository.owner" [repo]="repository.repo" />
      <app-repository-commits [owner]="repository.owner" [repo]="repository.repo" />
      <app-repository-releases [owner]="repository.owner" [repo]="repository.repo" />
    </div>
  } @else if (organization(); as organization) {
    <app-organization-header
      [name]="name()"
      [organization]="summary()?.organization"
      [fetchedAt]="summary()?.fetchedAt"
    />
    @if (summary()?.denied; as denied) {
      <app-denied [denied]="denied" />
    }
    <!-- Laid out as a repository's. -->
    <div class="grid">
      <app-organization-stats [org]="organization.org" />
      <app-organization-languages [org]="organization.org" />
      <app-organization-top-repositories [org]="organization.org" />
      <app-organization-last-push [org]="organization.org" />
      <app-organization-created [org]="organization.org" />
      <app-organization-repositories [org]="organization.org" />
      <app-organization-members [org]="organization.org" />
    </div>
  }
</main>
