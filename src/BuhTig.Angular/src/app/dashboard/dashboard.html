<header>
  <a class="wordmark" routerLink="/">BuhTig</a>
  <app-search [compact]="true" [prefill]="'github.com/' + name()" />
  <app-account />
</header>
<main>
  <div class="summary">
    <h1>{{ name() }}</h1>
    @if (fetchedAt(); as fetchedAt) {
      <p>Updated <app-relative-time [value]="fetchedAt" /></p>
    }
  </div>
  <!-- The widgets (#15 to #20), in two columns, or one on narrow screens (UI-05). -->
  <div class="grid"></div>
</main>
