<p class="summary">{{ summary() }}</p>
<details #details (toggle)="open.set(details.open)">
  <summary>{{ open() ? hide : show }}</summary>
  <table>
    <thead>
      <tr>
        <th scope="col">{{ headers()[0] }}</th>
        <th scope="col" class="figure">{{ headers()[1] }}</th>
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track $index) {
        <tr>
          <th scope="row">{{ row.label }}</th>
          <td class="figure">{{ row.value }}</td>
        </tr>
      }
    </tbody>
  </table>
</details>
