<app-widget heading="Releases" empty="No releases yet.">
  <ng-template [appLoaded]="releases" let-releases>
    <ol>
      @for (release of releases; track release.tag) {
        <li>
          @if (release.url; as url) {
            <a class="tag" [href]="url">{{ release.tag }}</a>
          } @else {
            <span class="tag">{{ release.tag }}</span>
          }
          @if (release.name; as name) {
            <span class="name">{{ name }}</span>
          }
          @if (release.prerelease) {
            <span class="badge">{{ prerelease }}</span>
          }
          @if (release.publishedAt; as publishedAt) {
            <span class="date"><app-relative-time [value]="publishedAt" /></span>
          }
        </li>
      }
    </ol>
  </ng-template>
</app-widget>
