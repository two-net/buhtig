<app-widget heading="Languages" empty="No code detected yet.">
  <ng-template [appLoaded]="languages">
    <!-- The legend below says all that the bar shows. -->
    <svg viewBox="0 0 100 1" preserveAspectRatio="none" aria-hidden="true">
      @for (segment of segments(); track $index) {
        <rect
          [attr.x]="segment.at"
          y="0"
          [attr.width]="segment.share"
          height="1"
          [style.fill]="segment.color"
        />
        <!-- A gap of the background's color before each segment but the first. -->
        @if (segment.at > 0) {
          <line
            class="gap"
            [attr.x1]="segment.at"
            [attr.x2]="segment.at"
            y1="0"
            y2="1"
            vector-effect="non-scaling-stroke"
          />
        }
      }
    </svg>
    <ul>
      @for (segment of segments(); track $index) {
        <li class="stagger" [style.--i]="$index">
          <span class="swatch" [style.background]="segment.color"></span>
          <span class="name">{{ segment.name }}</span>
          <span class="share">{{ segment.percent }}</span>
        </li>
      }
    </ul>
    <app-chart-alternative [summary]="summary()" [headers]="headers" [rows]="rows()" />
  </ng-template>
</app-widget>
