<app-widget heading="Statistics" empty="No statistics yet." [wide]="true" [hideHeading]="true">
  <ng-template [appLoaded]="stats" let-stats>
    <dl>
      <div>
        <dt>Stars</dt>
        <dd><app-compact-number [value]="stats.stars" [countUp]="true" /></dd>
      </div>
      <div>
        <dt>Forks</dt>
        <dd><app-compact-number [value]="stats.forks" [countUp]="true" /></dd>
      </div>
      <div>
        <dt>Watchers</dt>
        <dd><app-compact-number [value]="stats.watchers" [countUp]="true" /></dd>
      </div>
      <div>
        <dt>Open issues</dt>
        <dd><app-compact-number [value]="stats.openIssues" [countUp]="true" /></dd>
      </div>
      <div>
        <dt>Open pull requests</dt>
        <dd><app-compact-number [value]="stats.openPullRequests" [countUp]="true" /></dd>
      </div>
      <div class="release">
        <dt>Latest release</dt>
        @if (stats.latestRelease; as release) {
          <dd>
            @if (release.url; as url) {
              <a [href]="url">{{ release.tag }}</a>
            } @else {
              {{ release.tag }}
            }
          </dd>
          @if (release.publishedAt; as publishedAt) {
            <dd class="date"><app-relative-time [value]="publishedAt" /></dd>
          }
        } @else {
          <dd class="none">No releases</dd>
        }
      </div>
    </dl>
  </ng-template>
</app-widget>
