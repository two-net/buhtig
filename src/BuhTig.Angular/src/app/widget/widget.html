<section [attr.aria-labelledby]="id" [attr.aria-busy]="busy()">
  <h2 [id]="id" [class.visually-hidden]="hideHeading()">{{ heading() }}</h2>
  @switch (state().status) {
    @case ('loading') {
      <!-- A placeholder of about the content's size, so that little moves once it is there. -->
      <div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
      <p class="visually-hidden">{{ loading }}</p>
    }
    @case ('computing') {
      <p class="message">{{ computing }}</p>
      <div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
    }
    @case ('empty') {
      <p class="message">{{ empty() }}</p>
    }
    @case ('error') {
      <p class="message">{{ failed }}</p>
      <button type="button" (click)="retry()">Try again</button>
    }
    @case ('ready') {
      <ng-container *ngTemplateOutlet="content().template; context: { $implicit: data() }" />
    }
  }
</section>
