<section #section tabindex="-1" [attr.aria-labelledby]="id" [attr.aria-busy]="busy()">
  <h2 [id]="id" [class.visually-hidden]="hideHeading()">{{ heading() }}</h2>
  @switch (state().status) {
    @case ('loading') {
      <!-- A placeholder of about the content's size, so that little moves once it is there. -->
      <div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
      <p class="visually-hidden">{{ loading }}</p>
    }
    @case ('computing') {
      <p class="message">{{ computing }}</p>
      <div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
    }
    @case ('empty') {
      <p class="message">{{ empty() }}</p>
    }
    @case ('error') {
      <p class="message">{{ failed() }}</p>
      @if (held()) {
        <a class="action" [href]="signIn()">Sign in</a>
      } @else {
        <button type="button" class="action" (click)="retry()">Try again</button>
      }
    }
    @case ('ready') {
      <ng-container *ngTemplateOutlet="content().template; context: { $implicit: data() }" />
    }
  }
  <!-- Always there, so that assistive technology announces what "Try again" came to. -->
  <p class="visually-hidden" role="status">{{ outcome() }}</p>
</section>
